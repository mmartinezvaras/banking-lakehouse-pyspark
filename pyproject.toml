[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-lakehouse"
version = "1.0.0"
description = "Bank-transaction lakehouse with PySpark and Delta Lake: Bronze → Silver → Gold and fraud detection with window functions."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B905"]
